# ==============================================================================
# Configuration Nginx Reverse-Proxy pour Serveur LLP (lolpaon)
# Emplacement recommandé : /etc/nginx/sites-available/llp-server.conf
# Activation : sudo ln -s /etc/nginx/sites-available/llp-server.conf /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Remplacez par votre domaine ou IP

    # Redirection automatique vers HTTPS si certificat configuré (ex: Certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # En-têtes pour WebSockets et streaming RPC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Transmission des IP réelles du client
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts pour requêtes longues / calculs intensifs
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Taille maximale des transferts (bases .cllpdb, fichiers, etc.)
        client_max_body_size 50M;
    }

    # Journalisation
    access_log /var/log/nginx/llp-server-access.log;
    error_log /var/log/nginx/llp-server-error.log;
}
